<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krem Chympe — Adventure &amp; Camping</title>

  <!--
    IMAGES: edit the file names below to match whatever you upload into the
    "images" folder next to this page. Every image on the site is listed
    here — nothing else in the code needs to change.

    - This site comes with a starter set of images already in the "images"
      folder (same photos it had before), so it works right out of the box.
    - To swap a photo: upload your new file into "images" and change the
      matching line below to its file name (or a full https:// URL).
    - guide / logo are not included yet — add your own "images/guide.jpg"
      and "images/logo.png" (or point them at different file names).
  -->
  <script>
    window.KC_IMAGES = {
      // Rotating homepage background photos
      heroBg1: "images/hero-bg-1.jpg",
      heroBg2: "images/hero-bg-2.jpg",

      // Section photos
      heroCave:    "images/hero-cave.jpg",
      trekCard:    "images/trek-card.jpg",
      campingCard: "images/camping-card.jpg",

      // Guide photo and site logo (add your own files for these)
      guide: "images/guide.jpg",
      logo:  "images/logo.png",

      // Gallery photos (id 0-9, matches the categories shown on the site)
      gallery0: "images/gallery-0-cave.jpg",
      gallery1: "images/gallery-1-waterfall.jpg",
      gallery2: "images/gallery-2-trek.jpg",
      gallery3: "images/gallery-3-camping.jpg",
      gallery4: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=400",
      gallery5: "images/gallery-5-cave.jpg",
      gallery6: "images/gallery-6-waterfall.jpg",
      gallery7: "images/gallery-7-cave.jpg",
      gallery8: "images/gallery-8-trek.jpg",
      gallery9: "images/gallery-9-camping.jpg"
    };
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>
  <!-- Main app (compiled React bundle) -->
  <script type="module" src="app.js"></script>
  <!-- Makes external links open safely in a new tab -->
  <script src="safelinks.js"></script>
  <!-- Content Editor: pencil-icon tap-to-edit tool for text/images/highlights -->
  <script src="editor.js"></script>
</body>
</html>
