<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Krem Chympe Adventure & Camping</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDKs (Compat version for single HTML file) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        glass: "rgba(255, 255, 255, 0.05)",
                        glassDark: "rgba(10, 24, 16, 0.4)",
                        neon: "#c6ff6a",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            background: #000 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2584&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        /* Mobile-Optimized Glassmorphism */
        .glass-panel {
            background: rgba(15, 30, 20, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }
        @media (hover: hover) {
            .glass-panel:hover {
                border: 1px solid rgba(198, 255, 106, 0.3);
                box-shadow: 0 8px 40px 0 rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.2);
            }
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: white;
            padding: 0.75rem 1rem;
            width: 100%;
            outline: none;
            transition: border 0.3s ease;
            appearance: none; /* Mobile fix */
        }
        .glass-input:focus {
            border-color: #c6ff6a;
        }
        .neon-btn {
            background: #c6ff6a;
            color: #08140c;
            font-weight: 600;
            padding: 0.85rem 1.5rem; /* Touch friendly */
            border-radius: 0.75rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%; /* Mobile first */
        }
        @media (min-width: 768px) {
            .neon-btn { width: auto; }
        }
        .neon-btn:active, .neon-btn:hover:not(:disabled) {
            background: #aae048;
            box-shadow: 0 0 15px rgba(198, 255, 106, 0.5);
            transform: translateY(-2px);
        }
        .neon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #555;
            color: #999;
            box-shadow: none;
        }
        /* Mobile Scrollbar hiding */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Spinner */
        .loader { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white selection:bg-neon/30">
    <div id="root"></div>

    <script type="text/babel">
        // --- FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://chympe-order-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const storage = firebase.storage();

        const { useState, useEffect, useRef } = React;

        // --- ICONS (SVG) ---
        const IconCheck = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const IconUser = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
        const IconClock = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconStar = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
        const IconShield = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
        const IconMenu = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
        const IconClose = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

        // --- PRICING DATA ---
        const PRICING = {
            guide: 1500,
            camping: 2000,
            vehicleRainy: 2000,
            vehicleWinter: 4000,
            rafting: 1000,
            lifeJacket: 100,
            parking: 100,
            entry: 50,
            advTrek: 1500,
            campExp: 3500,
            vegMeal: 150,
            nonVegMeal: 250,
            campItem: 100 // Flat rate for individual camp items like tents/torches
        };

        const INITIAL_BOOKING_STATE = {
            package: '',
            name: '', whatsapp: '', email: '', date: '', people: 1,
            guide: true, 
            vehicle: 'none', 
            campingEnabled: false,
            camping: { tent: 0, torch: 0, blanket: 0, sleepingBag: 0, campfire: 0 },
            meals: {
                veg: { rice: 0, dal: 0, maggie: 0, tea: 0, salad: 0 },
                nonVeg: { chicken: 0, egg: 0, fish: 0, pork: 0 }
            },
            activities: { caveTrek: false, waterfallVisit: false, swimming: false, photography: false, bambooRafting: false },
            facilities: { guide: true, helmet: false, parking: false, lifeJacket: false, safetyEquipment: false, firstAid: false }
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [view, setView] = useState('page1'); 
            const [booking, setBooking] = useState(INITIAL_BOOKING_STATE);
            const [finalBookingId, setFinalBookingId] = useState("");
            const [adminTaps, setAdminTaps] = useState(0);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // Secret Admin Trigger
            const handleLogoClick = () => {
                setAdminTaps(prev => prev + 1);
                setTimeout(() => setAdminTaps(0), 3000); 
                if (adminTaps === 6) {
                    const pass = prompt("Enter Admin Password:");
                    if (pass === "admin123") {
                        setView('admin');
                        setIsMobileMenuOpen(false);
                    }
                }
            };

            const navigateTo = (page) => {
                setView(page);
                setIsMobileMenuOpen(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const Header = () => (
                <header className="sticky top-0 z-50 p-4 bg-black/40 backdrop-blur-xl border-b border-white/10 flex justify-between items-center transition-all">
                    <div className="flex items-center gap-3 cursor-pointer select-none" onClick={handleLogoClick}>
                        <div className="w-10 h-10 rounded-full bg-cover bg-center border border-white/20" style={{backgroundImage: "url('https://images.unsplash.com/photo-1542332213-31f87348057f?q=80&w=200&auto=format&fit=crop')"}}></div>
                        <div>
                            <h1 className="font-bold tracking-widest text-lg leading-none md:text-xl">KREM CHYMPE</h1>
                            <p className="text-[9px] md:text-[10px] tracking-widest text-gray-400 mt-0.5">ADVENTURE & CAMPING</p>
                        </div>
                    </div>
                    
                    {/* Desktop Nav */}
                    <nav className="hidden md:flex glass-panel rounded-full px-6 py-2 gap-6 text-sm font-medium">
                        <button onClick={() => navigateTo('page1')} className={`hover:text-neon transition ${view==='page1'?'text-neon':''}`}>Home</button>
                        <button className="hover:text-neon transition">Explore</button>
                        <button onClick={() => navigateTo('page2')} className={`hover:text-neon transition ${view==='page2'?'text-neon':''}`}>Packages</button>
                        <button onClick={() => navigateTo('page2')} className="hover:text-neon transition">Gallery</button>
                        <button onClick={() => navigateTo('page2')} className="hover:text-neon transition">Booking</button>
                        <button className="hover:text-neon transition">Contact</button>
                    </nav>

                    {/* Mobile Hamburger */}
                    <button className="md:hidden text-white p-2" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                        {isMobileMenuOpen ? <IconClose /> : <IconMenu />}
                    </button>

                    {/* Mobile Menu Dropdown */}
                    {isMobileMenuOpen && (
                        <div className="absolute top-full left-0 w-full bg-black/95 backdrop-blur-3xl border-b border-white/10 flex flex-col md:hidden py-4 shadow-2xl animate-fade-in z-50">
                            {['Home', 'Explore', 'Packages', 'Gallery', 'Booking', 'Contact'].map((item) => (
                                <button key={item} 
                                    onClick={() => navigateTo(item === 'Home' ? 'page1' : 'page2')} 
                                    className="px-6 py-4 text-left text-lg font-medium hover:bg-white/5 hover:text-neon border-b border-white/5 last:border-0 transition-colors">
                                    {item}
                                </button>
                            ))}
                        </div>
                    )}
                </header>
            );

            const calculateTotals = () => {
                let total = booking.people * (booking.package === 'camping' ? PRICING.campExp : PRICING.advTrek);
                if (booking.guide) total += PRICING.guide;
                if (booking.campingEnabled) total += PRICING.camping;
                if (booking.vehicle === 'rainy') total += PRICING.vehicleRainy;
                if (booking.vehicle === 'winter') total += PRICING.vehicleWinter;
                if (booking.facilities.parking) total += PRICING.parking;
                if (booking.facilities.lifeJacket) total += (PRICING.lifeJacket * booking.people);
                if (booking.activities.bambooRafting) total += PRICING.rafting;
                
                const sumObj = (obj) => Object.values(obj).reduce((a,b) => a + b, 0);
                total += sumObj(booking.meals.veg) * PRICING.vegMeal;
                total += sumObj(booking.meals.nonVeg) * PRICING.nonVegMeal;
                total += sumObj(booking.camping) * PRICING.campItem; 
                
                return total;
            };

            // --- VIEW: PAGE 1 (HOME) ---
            if (view === 'page1') return (
                <div className="min-h-screen fade-in pb-24">
                    <Header />
                    <main className="max-w-7xl mx-auto px-4 pt-8 md:pt-16 flex flex-col lg:flex-row gap-8 lg:gap-12 items-center">
                        <div className="flex-1 space-y-4 md:space-y-6 text-center lg:text-left">
                            <h2 className="text-4xl md:text-6xl lg:text-7xl font-bold leading-tight drop-shadow-lg">Discover Meghalaya's Hidden Paradise</h2>
                            <p className="text-base md:text-lg text-gray-300 max-w-lg mx-auto lg:mx-0 drop-shadow-md">Explore mystical caves, breathtaking waterfalls, and thrilling adventures.</p>
                            <div className="pt-4 flex justify-center lg:justify-start">
                                <button className="neon-btn md:w-auto" disabled>Book Now</button>
                            </div>
                        </div>
                        
                        <div className="w-full lg:w-1/3 glass-panel p-6 md:p-8 space-y-6">
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-white/10 rounded-xl"><IconUser /></div>
                                <div><p className="text-sm text-gray-400">Visitors</p><p className="font-semibold text-lg">1 - 5 People</p></div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="p-3 bg-white/10 rounded-xl"><IconClock /></div>
                                <div><p className="text-sm text-gray-400">Duration</p><p className="font-semibold text-lg">2 Hours Trek</p></div>
                            </div>
                            <div className="border-t border-white/10 pt-6">
                                <p className="text-sm text-gray-400 mb-1">Price Starts From</p>
                                <p className="text-4xl md:text-5xl font-bold text-neon drop-shadow-md">₹1500<span className="text-sm text-white font-normal"> / Person</span></p>
                            </div>
                            <button onClick={() => navigateTo('page2')} className="w-full neon-btn mt-4">Book Now</button>
                        </div>
                    </main>

                    {/* Stats Section */}
                    <div className="max-w-7xl mx-auto px-4 mt-12 md:mt-20 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                        <div className="glass-panel p-5 md:p-6 flex items-center justify-between">
                            <div><p className="text-sm text-gray-400">Trusted by</p><p className="text-lg md:text-xl font-bold">1000+ Travelers</p></div>
                            <div className="flex -space-x-3">
                                {[1,2,3,4].map(i => <div key={i} className="w-10 h-10 rounded-full border-2 border-black bg-gray-600 bg-cover shadow-lg" style={{backgroundImage: `url(https://i.pravatar.cc/100?img=${i})`}}></div>)}
                            </div>
                        </div>
                        <div className="glass-panel p-5 md:p-6 flex items-center gap-4">
                            <div className="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-red-500 to-yellow-500">G</div>
                            <div>
                                <p className="text-sm text-gray-400">Google Rating</p>
                                <div className="flex items-center gap-2">
                                    <p className="text-xl font-bold">4.9</p>
                                    <div className="flex text-yellow-400"><IconStar/><IconStar/><IconStar/><IconStar/><IconStar/></div>
                                </div>
                            </div>
                        </div>
                        <div className="glass-panel p-5 md:p-6 flex items-center gap-4 sm:col-span-2 lg:col-span-1">
                            <div className="p-3 bg-white/10 rounded-xl"><IconShield /></div>
                            <div><p className="text-sm text-gray-400">Safety Certified</p><p className="font-bold text-lg">First Aid & Equipment</p></div>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 w-full p-4 bg-black/80 backdrop-blur-xl flex justify-between items-center z-40 border-t border-white/10">
                        <button className="px-6 py-2.5 rounded-xl bg-white/5 text-gray-500 cursor-not-allowed font-medium text-sm md:text-base">Back</button>
                        <button onClick={() => navigateTo('page2')} className="neon-btn px-8 text-sm md:text-base">Next Step</button>
                    </div>
                </div>
            );

            // --- VIEW: PAGE 2 (PACKAGES & GALLERY) ---
            if (view === 'page2') return (
                <div className="min-h-screen fade-in pb-28">
                    <Header />
                    <div className="max-w-7xl mx-auto px-4 py-8 md:py-12">
                        <div className="text-center mb-10 md:mb-16">
                            <h2 className="text-3xl md:text-5xl font-bold drop-shadow-lg">Our Adventure Packages</h2>
                            <p className="text-gray-400 mt-3 md:text-lg">Choose your perfect adventure</p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 max-w-5xl mx-auto">
                            {/* Adventure Package */}
                            <div className="glass-panel p-5 md:p-8 flex flex-col group">
                                <div className="h-56 md:h-64 rounded-2xl bg-cover bg-center mb-6 shadow-inner overflow-hidden relative" style={{backgroundImage: "url('https://images.unsplash.com/photo-1574870111867-089730e5a72b?q=80&w=800&auto=format&fit=crop')"}}>
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                                    <h3 className="absolute bottom-4 left-4 text-2xl font-bold text-white">Adventure Trek</h3>
                                </div>
                                <p className="text-neon text-4xl font-bold mb-6 drop-shadow-md">₹1500<span className="text-base text-gray-300 font-normal"> / Person</span></p>
                                <ul className="space-y-3 mb-8 flex-1 text-gray-200">
                                    {['Local Guide Included', 'Safety Equipment Provided', 'Deep Cave Exploration', 'Scenic Waterfall Visit'].map(f => (
                                        <li key={f} className="flex items-center gap-3"><span className="text-neon"><IconCheck /></span> {f}</li>
                                    ))}
                                </ul>
                                <button onClick={() => { setBooking({...booking, package: 'adventure', campingEnabled: false}); navigateTo('booking'); }} className="w-full neon-btn text-lg py-3">Book Adventure</button>
                            </div>

                            {/* Camping Package */}
                            <div className="glass-panel p-5 md:p-8 flex flex-col group">
                                <div className="h-56 md:h-64 rounded-2xl bg-cover bg-center mb-6 shadow-inner overflow-hidden relative" style={{backgroundImage: "url('https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?q=80&w=800&auto=format&fit=crop')"}}>
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                                    <h3 className="absolute bottom-4 left-4 text-2xl font-bold text-white">Camping Experience</h3>
                                </div>
                                <p className="text-neon text-4xl font-bold mb-6 drop-shadow-md">₹3500<span className="text-base text-gray-300 font-normal"> / Person</span></p>
                                <ul className="space-y-3 mb-8 flex-1 text-gray-200">
                                    {['Riverside Tent Stay', 'Traditional Dinner', 'Morning Breakfast', 'Night Bonfire Setup'].map(f => (
                                        <li key={f} className="flex items-center gap-3"><span className="text-neon"><IconCheck /></span> {f}</li>
                                    ))}
                                </ul>
                                <button onClick={() => { setBooking({...booking, package: 'camping', campingEnabled: true}); navigateTo('booking'); }} className="w-full neon-btn text-lg py-3">Book Camping</button>
                            </div>
                        </div>

                        {/* Gallery Section */}
                        <div className="mt-20 md:mt-32 text-center">
                            <h2 className="text-3xl md:text-5xl font-bold drop-shadow-lg">Our Gallery</h2>
                            <p className="text-gray-400 mt-3 mb-8 md:text-lg">Moments from Krem Chympe</p>
                            
                            {/* Scrollable Categories on Mobile */}
                            <div className="flex overflow-x-auto pb-4 md:flex-wrap md:justify-center gap-3 md:gap-4 mb-8 snap-x snap-mandatory px-4 md:px-0 hide-scrollbar">
                                {['All', 'Cave', 'Waterfall', 'Camping', 'Trek', 'Drone'].map((cat, i) => (
                                    <button key={cat} className={`snap-center shrink-0 px-6 py-2.5 rounded-full border text-sm md:text-base whitespace-nowrap transition-all ${i === 0 ? 'bg-neon text-black border-neon font-bold shadow-[0_0_15px_rgba(198,255,106,0.3)]' : 'border-white/20 hover:bg-white/10 text-gray-300'}`}>{cat}</button>
                                ))}
                            </div>

                            {/* Mansory-style Mobile-Friendly Grid */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 max-w-6xl mx-auto px-4">
                                {[
                                    'https://images.unsplash.com/photo-1518709268805-4e9042af9f23',
                                    'https://images.unsplash.com/photo-1433086966358-54859d0ed716',
                                    'https://images.unsplash.com/photo-1504280390224-4d876bc29ba3',
                                    'https://images.unsplash.com/photo-1478131143081-80f7f84ca84d',
                                    'https://images.unsplash.com/photo-1542332213-31f87348057f',
                                    'https://images.unsplash.com/photo-1533587851505-d119e131517f'
                                ].map((img, i) => (
                                    <div key={i} className="aspect-[4/3] sm:aspect-square rounded-2xl bg-cover bg-center border border-white/10 shadow-lg hover:scale-[1.02] transition-transform duration-300 cursor-pointer" style={{backgroundImage: `url('${img}?q=80&w=600&auto=format&fit=crop')`}}></div>
                                ))}
                            </div>
                            <button onClick={() => window.open('https://instagram.com', '_blank')} className="mt-12 px-8 py-3.5 rounded-xl bg-white/5 border border-white/20 hover:bg-white/10 transition inline-flex items-center justify-center gap-3 font-medium w-[90%] md:w-auto">
                                Visit All Posts 
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div className="fixed bottom-0 left-0 w-full p-4 bg-black/80 backdrop-blur-xl flex justify-between items-center z-40 border-t border-white/10">
                        <button onClick={() => navigateTo('page1')} className="px-6 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 transition font-medium text-sm md:text-base">Back to Home</button>
                    </div>
                </div>
            );

            // --- VIEW: BOOKING FORM ---
            if (view === 'booking') {
                const Counter = ({ label, value, onChange }) => (
                    <div className="flex items-center justify-between bg-black/30 p-3.5 md:p-4 rounded-xl border border-white/5 shadow-inner">
                        <span className="font-medium text-sm md:text-base">{label}</span>
                        <div className="flex items-center gap-4">

                    setIsSubmitting(true);
                    
                    try {
                        let receiptUrl = "";
                        // If Firebase Config is fully set, attempt upload
                        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                            const receiptRef = storage.ref(`receipts/${Date.now()}_${receiptFile.name}`);
                            await receiptRef.put(receiptFile);
                            receiptUrl = await receiptRef.getDownloadURL();
                        } else {
                            console.warn("Storage API key missing, skipping actual image upload. Saving DB data only.");
                            receiptUrl = "LOCAL_MOCK_URL";
                        }

                        // Generate ID and Save to Realtime Database
                        const bookingId = "KRM-" + Math.floor(1000 + Math.random()*9000);
                        const bookingData = {
                            id: bookingId,
                            ...booking,
                            total: total,
                            advance: advance,
                            remaining: total - advance,
                            receiptUrl: receiptUrl,
                            status: "Pending",
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        };

                        await db.ref('bookings/' + bookingId).set(bookingData);

                        // Compile comprehensive text for WhatsApp
                        const activitiesList = Object.keys(booking.activities).filter(k => booking.activities[k]).join(", ");
                        const text = encodeURIComponent(`*🏕️ New Booking Request: ${bookingId}*

*Client:* ${booking.name}
*Phone:* ${booking.whatsapp}
*Email:* ${booking.email}
*Expedition Date:* ${booking.date}
*No. of People:* ${booking.people}
*Package:* ${booking.package.toUpperCase()}

*Details:*
• Transport: ${booking.vehicle}
• Activities: ${activitiesList || 'None'}
• Camping: ${booking.campingEnabled ? 'Yes' : 'No'}

*Financials:*
• Grand Total: ₹${total}
• Advance Paid: ₹${advance}
• Remaining Balance: ₹${total - advance}

_Payment Receipt uploaded to database._`);

                        // Open WhatsApp
                        window.open(`https://wa.me/916001877518?text=${text}`, '_blank');
                        
                        setFinalBookingId(bookingId);
                        navigateTo('confirmation');
                    } catch (error) {
                        console.error("Firebase Error:", error);
                        alert("Error securing booking to database. Make sure Firebase config is correct.");
                    } finally {
                        setIsSubmitting(false);
                    }
                };

                return (
                    <div className="min-h-screen fade-in pb-28">
                        <Header />
                        <div className="max-w-5xl mx-auto px-4 py-8 md:py-12">
                            <h2 className="text-3xl md:text-4xl font-bold text-center mb-8 drop-shadow-md">Secure Payment</h2>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                {/* Methods Section */}
                                <div className="glass-panel p-5 md:p-8 space-y-8 h-full">
                                    <div>
                                        <h3 className="text-2xl font-bold border-b border-white/10 pb-3 mb-6 flex items-center gap-3"><span className="w-8 h-8 rounded-full bg-neon/20 text-neon flex items-center justify-center text-sm">1</span> Scan QR Code</h3>
                                        <div className="flex flex-col items-center bg-white p-6 rounded-2xl shadow-xl mx-auto w-fit">
                                            {/* Using generic UPI generation for demo. Replace PA with actual UPI ID */}
                                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=6001877518@upi&pn=KremChympe&cu=INR" alt="QR Code" className="w-48 h-48 md:w-56 md:h-56" />
                                            <button className="mt-5 text-black font-bold text-sm uppercase tracking-widest border-2 border-black rounded-lg px-6 py-2 hover:bg-black hover:text-white transition-colors">Download QR</button>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <h3 className="text-xl font-bold border-b border-white/10 pb-3 mb-4">Direct UPI</h3>
                                        <div className="bg-black/30 p-4 md:p-5 rounded-xl border border-white/5 flex justify-between items-center group hover:border-white/20 transition-colors">
                                            <span className="font-mono tracking-wider text-lg">6001877518@upi</span>
                                            <button className="px-4 py-2 bg-white/10 rounded-lg text-neon text-sm font-medium hover:bg-white/20 transition-colors" onClick={() => navigator.clipboard.writeText("6001877518@upi")}>Copy</button>
                                        </div>
                                    </div>

                                    <div>
                                        <h3 className="text-xl font-bold border-b border-white/10 pb-3 mb-4">Bank Transfer</h3>
                                        <div className="bg-black/30 p-5 md:p-6 rounded-xl border border-white/5 space-y-3">
                                            <div className="flex justify-between items-center"><span className="text-gray-400 text-sm font-medium uppercase tracking-wider">A/C Holder</span><span className="font-bold text-lg text-right">David Tariang</span></div>
                                            <div className="flex justify-between items-center"><span className="text-gray-400 text-sm font-medium uppercase tracking-wider">A/C Number</span><span className="font-mono text-lg text-right">123456789012</span></div>
                                            <div className="flex justify-between items-center"><span className="text-gray-400 text-sm font-medium uppercase tracking-wider">IFSC Code</span><span className="font-mono text-lg text-right">SBIN0001234</span></div>
                                            <div className="flex justify-between items-center"><span className="text-gray-400 text-sm font-medium uppercase tracking-wider">Branch</span><span className="text-right">Shillong</span></div>
                                            <button className="w-full mt-4 py-2 bg-white/10 rounded-lg text-white text-sm font-medium hover:bg-white/20 transition-colors" onClick={() => navigator.clipboard.writeText("123456789012")}>Copy Bank Details</button>
                                        </div>
                                    </div>
                                </div>

                                {/* Form Section */}
                                <div className="glass-panel p-5 md:p-8 space-y-8 flex flex-col justify-between border-neon/30 shadow-[inset_0_0_20px_rgba(198,255,106,0.05)]">
                                    <div>
                                        <h3 className="text-2xl font-bold border-b border-white/10 pb-3 mb-6 flex items-center gap-3"><span className="w-8 h-8 rounded-full bg-neon/20 text-neon flex items-center justify-center text-sm">2</span> Confirm Payment</h3>
                                        <div className="space-y-6">
                                            
                                            <div className="bg-black/20 p-5 rounded-xl border border-white/5">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-gray-400 font-medium">Grand Total</span>
                                                    <span className="text-xl font-bold">₹{total}</span>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm text-neon font-medium mb-2">Advance Amount Paying Now (Min ₹500)</label>
                                                <div className="relative">
                                                    <span className="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-xl font-bold">₹</span>
                                                    <input type="number" min="500" max={total} className="glass-input pl-10 py-4 text-2xl font-bold text-white bg-black/50 border-white/20" value={advance} onChange={e => handleAdvanceChange(e.target.value)} disabled={isSubmitting} />
                                                </div>
                                                {advance < 500 && advance !== "" && <p className="text-red-400 text-xs mt-2">Amount must be at least ₹500</p>}
                                            </div>

                                            <div className="bg-neon/10 p-5 rounded-xl border border-neon/20">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-gray-300 font-medium">Remaining Balance to pay on arrival</span>
                                                    <span className="text-2xl font-black text-neon">₹{Math.max(0, total - (advance || 0))}</span>
                                                </div>
                                            </div>

                                            <div className="pt-4 border-t border-white/10">
                                                <label className="block text-sm text-gray-300 font-medium mb-3">Upload Payment Receipt / Screenshot</label>
                                                {!receiptPreview ? (
                                                    <label className={`flex flex-col items-center justify-center w-full h-40 md:h-48 border-2 border-dashed border-white/30 rounded-2xl bg-black/30 hover:bg-black/50 hover:border-neon transition-all ${isSubmitting ? 'cursor-not-allowed opacity-50' : 'cursor-pointer'}`}>
                                                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="text-gray-400 mb-3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                                        <span className="text-base text-gray-300 font-medium">Tap to upload screenshot</span>
                                                        <span className="text-xs text-gray-500 mt-1">PNG, JPG, JPEG</span>
                                                        <input type="file" className="hidden" accept="image/*" disabled={isSubmitting} onChange={(e) => {
                                                            if(e.target.files[0]) {
                                                                setReceiptFile(e.target.files[0]);
                                                                setReceiptPreview(URL.createObjectURL(e.target.files[0]));
                                                            }
                                                        }} />
                                                    </label>
                                                ) : (
                                                    <div className="relative w-full h-40 md:h-48 rounded-2xl bg-cover bg-center border-2 border-neon overflow-hidden shadow-[0_0_15px_rgba(198,255,106,0.2)]" style={{backgroundImage: `url(${receiptPreview})`}}>
                                                        <div className="absolute inset-0 bg-black/40 opacity-0 hover:opacity-100 transition-opacity flex items-center justify-center">
                                                            {!isSubmitting && <button onClick={() => { setReceiptFile(null); setReceiptPreview(null); }} className="bg-red-500 text-white px-4 py-2 rounded-lg font-bold shadow-lg transform hover:scale-105 transition-transform">Remove & Replace</button>}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="fixed bottom-0 left-0 w-full p-4 bg-black/80 backdrop-blur-xl flex justify-between items-center z-40 border-t border-white/10 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                            <button onClick={() => navigateTo('summary')} className="px-4 md:px-6 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 transition font-medium text-sm md:text-base" disabled={isSubmitting}>Back</button>
                            <button onClick={handleSubmit} className="neon-btn w-2/3 md:w-auto text-sm md:text-base shadow-[0_0_20px_rgba(198,255,106,0.2)] flex justify-center items-center" disabled={isSubmitting || advance < 500 || !receiptFile}>
                                {isSubmitting ? <><div className="loader"></div> Processing...</> : "Submit & Open WhatsApp"}
                            </button>
                        </div>
                    </div>
                );
            }

            // --- VIEW: CONFIRMATION ---
            if (view === 'confirmation') return (
                <div className="min-h-screen fade-in flex items-center justify-center p-4">
                    <div className="glass-panel p-8 md:p-12 max-w-lg w-full text-center space-y-6 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-neon"></div>
                        <div className="w-24 h-24 bg-neon/20 rounded-full flex items-center justify-center mx-auto text-neon mb-6 border border-neon/50 shadow-[0_0_30px_rgba(198,255,106,0.3)]">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </div>
                        <h2 className="text-3xl md:text-4xl font-bold">Booking Confirmed!</h2>
                        <div className="bg-black/30 p-4 rounded-xl border border-white/10 inline-block mx-auto">
                            <p className="text-gray-400 text-sm mb-1 uppercase tracking-wider">Your Booking ID</p>
                            <p className="font-mono text-2xl md:text-3xl font-bold text-white tracking-widest">{finalBookingId}</p>
                        </div>
                        <p className="text-base text-gray-300 max-w-sm mx-auto leading-relaxed">We have securely saved your booking in our database. Our team will verify your payment and finalize details via WhatsApp.</p>
                        <div className="pt-8 flex flex-col sm:flex-row gap-4">
                            <button className="neon-btn w-full sm:w-1/2 py-3.5 text-base">Download Ticket PDF</button>
                            <button onClick={() => { setBooking(INITIAL_BOOKING_STATE); navigateTo('page1'); }} className="px-6 py-3.5 rounded-xl border border-white/20 hover:bg-white/10 transition w-full sm:w-1/2 font-medium">Return Home</button>
                        </div>
                    </div>
                </div>
            );

            // --- VIEW: SECRET ADMIN DASHBOARD (CONNECTED TO DB) ---
            if (view === 'admin') {
                const [adminBookings, setAdminBookings] = useState([]);
                const [isSidebarOpen, setIsSidebarOpen] = useState(false);
                
                // Fetch live data from Database
                useEffect(() => {
                    const bookingsRef = db.ref('bookings');
                    bookingsRef.on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const bookingsArray = Object.values(data).sort((a,b) => b.timestamp - a.timestamp);
                            setAdminBookings(bookingsArray);
                        }
                    });
                    return () => bookingsRef.off();
                }, []);

                const totalRevenue = adminBookings.reduce((sum, item) => sum + item.total, 0);
                const pendingCount = adminBookings.filter(b => b.status === "Pending").length;

                return (
                    <div className="min-h-screen bg-black text-white fade-in overflow-x-hidden">
                        <header className="p-4 border-b border-white/10 flex justify-between items-center bg-gray-900 sticky top-0 z-50">
                            <div className="flex items-center gap-3">
                                <button className="md:hidden text-white" onClick={() => setIsSidebarOpen(!isSidebarOpen)}>
                                    <IconMenu />
                                </button>
                                <h1 className="text-lg md:text-xl font-bold text-neon">KREM CHYMPE ADMIN</h1>
                            </div>
                            <button onClick={() => navigateTo('page1')} className="text-xs md:text-sm px-4 py-2 bg-red-500/20 text-red-500 font-bold rounded-lg hover:bg-red-500/40 transition">Logout</button>
                        </header>
                        <div className="flex relative min-h-[calc(100vh-65px)]">
                            
                            {/* Mobile Sidebar Overlay */}
                            {isSidebarOpen && <div className="fixed inset-0 bg-black/80 z-40 md:hidden" onClick={() => setIsSidebarOpen(false)}></div>}
                            
                            {/* Sidebar */}
                            <nav className={`w-64 border-r border-white/10 p-4 space-y-2 bg-gray-900 absolute md:static inset-y-0 left-0 transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300 z-50 h-full overflow-y-auto`}>
                                <div className="md:hidden flex justify-end mb-4">
                                    <button onClick={() => setIsSidebarOpen(false)}><IconClose /></button>
                                </div>
                                {['Dashboard', 'Bookings', 'Packages', 'Prices', 'Gallery', 'Settings', 'Analytics'].map((i, index) => (
                                    <button key={i} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-colors ${index === 0 ? 'bg-neon/10 text-neon border border-neon/20' : 'hover:bg-white/10 text-gray-300'}`}>{i}</button>
                                ))}
                            </nav>

                            {/* Main Admin Content */}
                            <main className="flex-1 p-4 md:p-8 w-full overflow-x-hidden">
                                <h2 className="text-2xl md:text-3xl font-bold mb-6">Dashboard Overview</h2>
                                
                                {/* Stat Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 mb-8">
                                    <div className="bg-gray-800 p-5 md:p-6 rounded-2xl border border-white/5 shadow-lg">
                                        <p className="text-gray-400 font-medium mb-1">Total Bookings</p>
                                        <p className="text-3xl md:text-4xl font-black">{adminBookings.length}</p>
                                    </div>
                                    <div className="bg-gray-800 p-5 md:p-6 rounded-2xl border border-white/5 shadow-lg">
                                        <p className="text-gray-400 font-medium mb-1">Total Revenue</p>
                                        <p className="text-3xl md:text-4xl font-black text-neon">₹{totalRevenue.toLocaleString('en-IN')}</p>
                                    </div>
                                    <div className="bg-gray-800 p-5 md:p-6 rounded-2xl border border-white/5 shadow-lg sm:col-span-2 lg:col-span-1">
                                        <p className="text-gray-400 font-medium mb-1">Pending Approvals</p>
                                        <p className="text-3xl md:text-4xl font-black text-yellow-500">{pendingCount}</p>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold">Live Bookings Database</h3>
                                    <button className="text-sm border border-white/20 px-3 py-1.5 rounded bg-white/5 hover:bg-white/10">Export CSV</button>
                                </div>
                                
                                {/* Responsive Table Container */}
                                <div className="bg-gray-800 rounded-2xl overflow-hidden border border-white/5 shadow-xl">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-gray-900 text-gray-400 uppercase tracking-wider text-xs">
                                                <tr>
                                                    <th className="p-4 font-medium">Booking ID</th>
                                                    <th className="p-4 font-medium">Customer Info</th>
                                                    <th className="p-4 font-medium">Date & Ppl</th>
                                                    <th className="p-4 font-medium">Financials</th>
                                                    <th className="p-4 font-medium">Status</th>
                                                    <th className="p-4 font-medium">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/5">
                                                {adminBookings.length === 0 && (
                                                    <tr><td colSpan="6" className="p-8 text-center text-gray-500 text-base">No bookings found in database.</td></tr>
                                                )}
                                                {adminBookings.map(b => (
                                                    <tr key={b.id} className="hover:bg-white/5 transition-colors">
                                                        <td className="p-4 font-mono font-bold text-neon">{b.id}</td>
                                                        <td className="p-4">
                                                            <p className="font-bold text-base">{b.name}</p>
                                                            <p className="text-xs text-gray-400">{b.whatsapp}</p>
                                                        </td>
                                                        <td className="p-4">
                                                            <p>{b.date}</p>
                                                            <p className="text-xs text-gray-400">{b.people} Pax</p>
                                                        </td>
                                                        <td className="p-4">
                                                            <p className="font-bold text-green-400">Total: ₹{b.total}</p>
                                                            <p className="text-xs text-gray-400">Adv: ₹{b.advance} | Rem: ₹{b.remaining}</p>
                                                        </td>
                                                        <td className="p-4">
                                                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${b.status==='Pending'?'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20':'bg-neon/10 text-neon border border-neon/20'}`}>{b.status}</span>
                                                        </td>
                                                        <td className="p-4">
                                                            <div className="flex gap-3">
                                                                {b.receiptUrl && b.receiptUrl !== "LOCAL_MOCK_URL" ? (
                                                                    <a href={b.receiptUrl} target="_blank" className="text-blue-400 hover:text-blue-300 font-medium hover:underline">Receipt</a>
                                                                ) : (
                                                                    <span className="text-gray-500 text-xs italic">No Receipt</span>
                                                                )}
                                                                <button className="text-neon hover:text-white font-medium hover:underline">Approve</button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </main>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
