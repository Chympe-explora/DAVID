    border-radius:0.75rem;
    color:#fff;
    padding:0.75rem 1rem;

  .glass-input::placeholder{ color:rgba(255,255,255,0.35); }

  .btn-primary{
    background:linear-gradient(180deg, var(--neon), var(--neon-dark));
    color:var(--ink); font-weight:700;
    padding:0.85rem 1.6rem; border-radius:0.85rem;
    display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;
    transition:all .2s ease; border:none; cursor:pointer;
  }
  .btn-primary:hover:not(:disabled){ box-shadow:0 0 22px rgba(198,255,106,0.5); transform:translateY(-2px); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; transform:none; }
  .btn-ghost{
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18);
    color:#fff; padding:0.85rem 1.6rem; border-radius:0.85rem; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;
    transition:all .2s ease;
  }
  .btn-ghost:hover:not(:disabled){ background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.3); }
  .btn-ghost:disabled{ opacity:0.35; cursor:not-allowed; }

  .pill{ border-radius:9999px; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-track{ background:rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.2); border-radius:10px; }

  .fade-in{ animation:fadeIn .45s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  .pop-in{ animation:popIn .3s ease both; }
  @keyframes popIn{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }

  .loader{ border:3px solid rgba(255,255,255,0.25); border-top:3px solid var(--ink); border-radius:50%; width:18px; height:18px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; }
  input[type="checkbox"], input[type="radio"]{ accent-color:var(--neon); width:18px; height:18px; }

  .stepper-btn{
    width:2.25rem; height:2.25rem; border-radius:9999px;

  .thumb-tab.active{ background:var(--neon); color:var(--ink); font-weight:700; }
  .thumb-tab:not(.active){ background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); color:#eee; }

  .nav-link{ position:relative; }
  .nav-link.active::after{ content:''; position:absolute; left:0; right:0; bottom:-4px; height:2px; background:var(--neon); border-radius:2px; }

  .toast{
